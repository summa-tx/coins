[package]
name = "coins-ledger"
authors = [
    "Summa <team@summa.one>",
    "James Prestwich <james@prestwi.ch>",
    "Zondax GmbH <info@zondax.ch>",
]
categories = ["authentication", "cryptography"]
keywords = ["ledger", "apdu", "cryptocurrency"]
description = "Ledger Nano X/S connection and communication management library"

version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
hex.workspace = true
thiserror.workspace = true
tracing = "0.1"
tokio = { version = "1.34", features = ["sync"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream"], optional = true }
serde = { workspace = true, features = ["derive"], optional = true }
serde_json = { workspace = true, optional = true }
futures-util = { version = "0.3", default-features = false, optional = true }

[features]
# The Speculos emulator transport.
speculos = [
    "dep:reqwest",
    "dep:serde",
    "dep:serde_json",
    "dep:futures-util",
    "tokio/net",
    "tokio/io-util",
    "tokio/time",
]

[package.metadata.docs.rs]
features = ["speculos"]
rustdoc-args = ["--cfg", "docsrs"]

# On Linux the default backend is hidraw, as in Ledger's own tooling.
[target.'cfg(not(target_os = "android"))'.dependencies]
hidapi = "2.6"

# Termux hands over an already-open USB file descriptor, which only the libusb
# backend can wrap. The two target tables are disjoint so the backends never
# unify.
[target.'cfg(target_os = "android")'.dependencies]
hidapi = { version = "2.6", default-features = false, features = ["linux-static-libusb"] }

[dev-dependencies]
tokio = { version = "1.34", features = ["rt", "macros"] }
serial_test = "2"
