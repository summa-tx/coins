[workspace]
members = [
    "crates/*"
]
resolver = "2"

[workspace.package]
version = "0.17.2"
edition = "2024"
rust-version = "1.85"
authors = [
    "Summa <team@summa.one>",
    "James Prestwich <james@prestwi.ch>",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/summa-tx/coins"

[workspace.dependencies]
coins-bip32 = { path = "crates/bip32", version = "0.17" }
coins-core = { path = "crates/core", version = "0.17" }

# core
bs58 = "0.5.1"
digest = "0.11"
hybrid-array = "0.4"
hex = { package = "const-hex", version = "1.12.0" }
ripemd = "0.2"
serde = "1.0.203"

# bip32
hmac = { version = "0.13", features = ["zeroize"] }
k256 = { version = "0.14", default-features = false, features = ["alloc", "arithmetic", "ecdsa", "precomputed-tables"] }
primeorder = { version = "0.14", default-features = false, features = ["std"] }
sha2 = { version = "0.11", features = ["zeroize"] }
thiserror = "1.0.61"
subtle = "2.6"
zeroize = { version = "1.8", features = ["derive"] }

# bip39
pbkdf2 = "0.13"
rand = { version = "0.10", default-features = false }
unicode-normalization = "0.1.25"

# dev
serde_json = "1.0"
